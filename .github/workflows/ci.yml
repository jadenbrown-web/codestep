name: CodeStep checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build and run regression tests
        run: npm test
      - name: Install browser for responsive checks
        run: npx playwright install --with-deps chromium
      - name: Check desktop and phone layouts
        run: npm run test:browser
      - name: Build the independent GitHub Pages app
        run: npm run test:pages
      - name: Save the standalone build
        uses: actions/upload-artifact@v4
        with:
          name: codestep-pages
          path: pages-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Save the production build
        uses: actions/upload-artifact@v4
        with:
          name: codestep-production
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/download-artifact@v4
        with:
          name: codestep-pages
          path: pages-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Deploy the independent app
        id: deployment
        uses: actions/deploy-pages@v4
